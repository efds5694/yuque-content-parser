<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>语雀内容解析器</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <p class="eyebrow">YUQUE CONTENT PARSER</p>
        <h1>语雀内容解析器</h1>
      </div>
      <div class="header-actions">
        <span id="pageBadge" class="badge neutral">检查页面</span>
        <button id="closeButton" class="icon-button" type="button" aria-label="关闭页内工具" title="关闭">×</button>
      </div>
    </header>

    <section class="card source-card">
      <fieldset>
        <legend>内容来源</legend>
        <label class="source-option">
          <input id="sourceAuto" type="radio" name="source" value="current-lake" checked>
          <span><strong>一键解析当前文档</strong><small>读取当前文档的 Lake 源内容，保真度最高</small></span>
        </label>
        <label class="source-option">
          <input id="sourcePage" type="radio" name="source" value="page">
          <span><strong>提取网页渲染内容</strong><small>支持精确选区；全文为页面尽力提取</small></span>
        </label>
        <label class="source-option">
          <input id="sourceLake" type="radio" name="source" value="lake">
          <span><strong>导入 .lake 文件</strong><small>解析完整源格式，保真度更高</small></span>
        </label>
      </fieldset>

      <div id="autoControls">
        <p class="auto-note">使用语雀当前登录态发起一次同源只读请求，不读取 Cookie，不修改文档。</p>
      </div>

      <div id="pageControls" class="hidden">
        <p class="field-label">页面范围</p>
        <div class="segmented">
          <label><input type="radio" name="scope" value="selection" checked><span>精确选区</span></label>
          <label><input type="radio" name="scope" value="document"><span>整篇文档</span></label>
        </div>
        <p id="selectionHint" class="hint">打开工具前先在正文中选择内容</p>
      </div>

      <div id="lakeControls" class="hidden">
        <label class="file-picker" for="lakeFile">
          <span>选择 .lake 文件</span>
          <input id="lakeFile" type="file" accept=".lake,text/html">
        </label>
        <p id="fileHint" class="hint">单个文件不超过 20 MiB；文件仅在本机浏览器中解析。</p>
      </div>

      <button id="parseButton" class="primary" type="button">一键解析当前文档</button>
      <p id="workStatus" class="status-line" aria-live="polite"></p>
    </section>

    <section id="resultSection" class="card hidden">
      <div class="result-heading">
        <div>
          <p class="eyebrow">PARSE RESULT</p>
          <h2 id="resultTitle">解析结果</h2>
        </div>
        <span id="fidelityBadge" class="badge neutral">—</span>
      </div>

      <div id="stats" class="stats" aria-label="解析统计"></div>
      <details id="diagnosticsBox" class="diagnostics hidden">
        <summary id="diagnosticsSummary">解析提示</summary>
        <ul id="diagnostics"></ul>
      </details>

      <div class="tabs" role="tablist" aria-label="输出格式">
        <button class="tab active" type="button" role="tab" data-format="markdown" aria-selected="true">Markdown</button>
        <button class="tab" type="button" role="tab" data-format="html" aria-selected="false">富文本</button>
        <button class="tab" type="button" role="tab" data-format="json" aria-selected="false">JSON</button>
      </div>

      <pre id="textPreview" class="preview" tabindex="0"></pre>
      <iframe id="htmlPreview" class="preview html-preview hidden" sandbox="" title="富文本预览"></iframe>

      <div class="result-actions">
        <button id="copyButton" class="secondary" type="button">复制 Markdown</button>
        <button id="downloadButton" class="primary compact" type="button">下载 .md</button>
      </div>
      <p class="hint privacy-note">不会下载图片或附件；输出只保留原始链接。</p>
    </section>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
